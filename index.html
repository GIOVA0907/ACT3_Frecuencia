<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health-Tracker | Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">

  <div class="container py-5">
    <h1 class="text-center mb-4">❤️ Health-Tracker</h1>
    <p class="text-center text-muted">Monitoreo de signos vitales diario</p>

    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card p-4 shadow-sm">
          <h4 class="mb-3">Iniciar sesión</h4>
          <form id="formLogin">
            <div class="mb-3">
              <label class="form-label">Usuario</label>
              <input type="text" id="usuario" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input type="password" id="password" class="form-control" required>
            </div>
            <div id="mensaje" class="text-danger mb-3"></div>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
          </form>
        </div>
        <p class="text-muted small mt-3 text-center">
          Médico: medico1 / 1234 &nbsp;|&nbsp; Pacientes: paciente1, paciente2, paciente3 / 1234
        </p>
      </div>
    </div>
  </div>

  <script src="js/datos.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
