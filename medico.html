<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health-Tracker | Panel de Médico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light d-none">

  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>👨‍⚕️ Panel de Médico</h1>
      <div>
        <span id="nombreMedico" class="me-3 fw-bold"></span>
        <button id="btnSalir" class="btn btn-outline-danger btn-sm">Cerrar sesión</button>
      </div>
    </div>

    <div class="row">
      <div class="col-md-4 mb-4">
        <h3>👥 Pacientes</h3>
        <div id="listaPacientes" class="list-group mt-3"></div>
      </div>

      <div class="col-md-8">
        <h3 id="tituloHistorial">📋 Historial</h3>
        <div id="historial" class="mt-3">
          <p class="text-muted">Selecciona un paciente para ver sus registros</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/datos.js"></script>
  <script src="js/medico.js"></script>
</body>
</html>
