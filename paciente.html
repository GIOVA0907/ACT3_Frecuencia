<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health-Tracker | Panel de Paciente</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light d-none">

  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>🩺 Panel de Paciente</h1>
      <div>
        <span id="nombrePaciente" class="me-3 fw-bold"></span>
        <button id="btnSalir" class="btn btn-outline-danger btn-sm">Cerrar sesión</button>
      </div>
    </div>

    <div class="card p-4 shadow-sm mb-4">
      <h5 id="tituloForm" class="mb-3">Registrar signos de hoy</h5>
      <form id="formSignos">
        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label">Presión arterial (ej. 120/80)</label>
            <input type="text" id="presion" class="form-control" pattern="\d{2,3}/\d{2,3}" placeholder="120/80" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Frecuencia cardíaca (lpm)</label>
            <input type="number" id="frecuencia" class="form-control" min="30" max="220" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Peso (kg)</label>
            <input type="number" id="peso" class="form-control" min="1" max="300" step="0.1" required>
          </div>
        </div>

        <button type="submit" id="btnGuardar" class="btn btn-success">Guardar registro</button>
        <button type="submit" id="btnActualizar" class="btn btn-warning d-none">Actualizar registro de hoy</button>
      </form>
    </div>

    <h3>📋 Mi historial</h3>
    <div id="historial" class="mt-3"></div>
  </div>

  <script src="js/datos.js"></script>
  <script src="js/paciente.js"></script>
</body>
</html>
